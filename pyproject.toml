[project]
name = "hostproof"
version = "0.1.0"
description = "LLM agent for evidence-driven Linux vulnerability validation, built with LangGraph and Ollama"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "httpx>=0.27,<1",
  "langgraph>=1.0,<2",
  "pydantic>=2.7,<3",
  "pyyaml>=6.0,<7",
  "rich>=13,<16",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
hostproof = "hostproof.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
