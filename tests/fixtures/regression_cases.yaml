# Synthetic regression cases used by the tests. Real results live in docs/TEST_RESULTS.md.
cases:
- id: ssh-running-exposed
  finding:
    vulnerability_id: CVE-2024-6387
    package: openssh-server
    installed_version: 1:9.2p1-2+deb12u2
    fixed_version: 1:9.2p1-2+deb12u3
    severity: HIGH
    title: 'regreSSHion: unauthenticated remote code execution in sshd'
    description: A signal handler race condition in the OpenSSH server (sshd), from 8.5p1 and before 9.8p1. It can
      allow unauthenticated remote code execution over the network. The vulnerable code is reached when the LoginGraceTime
      timer fires. Setting LoginGraceTime to 0 removes the code execution risk, but leaves sshd open to denial of
      service.
  host:
    host: web01
    packages:
      openssh-server:
        version: 1:9.2p1-2+deb12u2
        fixed:
          1:9.2p1-2+deb12u3: false
        runtime:
          services_provided:
          - ssh.service
          processes:
          - pid: '812'
            path: /usr/sbin/sshd
            deleted: false
          services_enabled:
          - ssh.service
          listeners:
          - 0.0.0.0:22
    files:
      /etc/ssh/sshd_config: 'Port 22

        PermitRootLogin no

        PasswordAuthentication no

        '
  expected:
    status: affected
    also_acceptable:
    - under_investigation
