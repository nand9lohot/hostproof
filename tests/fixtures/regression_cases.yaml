- id: httpd-running-root-open
  finding:
    vulnerability_id: CVE-2021-41773
    package: apache2
    installed_version: 2.4.49-1
    fixed_version: 2.4.51-1
    severity: HIGH
    title: Path traversal in Apache HTTP Server 2.4.49
    description: A path traversal flaw in Apache HTTP Server 2.4.49 lets attackers map URLs to files outside the
      document root. If files outside the document root are not protected by 'require all denied', these requests
      can succeed. Fixed by upgrading to 2.4.51.
  host:
    host: www01
    packages:
      apache2:
        version: 2.4.49-1
        fixed:
          2.4.51-1: false
        runtime:
          services_provided:
          - apache2.service
          processes:
          - pid: '1204'
            path: /usr/sbin/apache2
            deleted: false
          services_enabled:
          - apache2.service
          listeners:
          - 0.0.0.0:80
    files:
      /etc/apache2/apache2.conf: "ServerRoot /etc/apache2\n<Directory />\n    AllowOverride None\n    Require all\
        \ granted\n</Directory>\n"
  expected:
    status: affected
    also_acceptable:
    - under_investigation
